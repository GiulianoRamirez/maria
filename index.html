<!DOCTYPE HTML>
<html lang="en">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<meta charset="UTF-8">
	<title>Feliz primer mes juntos ❤️</title>
	<link rel="stylesheet" type="text/css" href="./css/format.css">
</head>

<body style="margin:0px">
	<audio id="backgroundMusic" loop>
		<source src="music/music.mp3" type="audio/mpeg">
		Tu navegador no soporta el elemento de audio.
	</audio>
	<canvas></canvas>
	<div id="imgTxt">
		<span id="Txt"></span> <br />
		<span id="tmp"></span>
		<img id="img" src="">
	</div>
	<div id="heartTxt">
		<span id="clickMe">Presiona el corazón</span>
		<div id="heart">
			<button id="button" onclick="play()"></button>
		</div>
	</div>
	<div id="content">
		<h2 id="together">Hemos estado juntos</h2>
		<div id="timer">
			<b id="d"></b> Dias
			<b id="h"></b> Horas
			<b id="m"></b> Minutos
			<b id="s"></b> Segundos
		</div>
	</div>

	<div id="typeDiv">
		<span id="txt1"></span> <br />
		<span id="txt2"></span>
	</div>

	<script type="text/javascript" src="./js/config.js"></script>
	<script type="text/javascript" src="./js/stars.js"></script>
	<script type="text/javascript" src="./js/typeWriter.js"></script>
	<script type="text/javascript" src="./js/date.js"></script>
	<script type="text/javascript" src="./js/playImg.js"></script>
</body>

</html>
